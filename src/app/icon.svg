<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Fondo: espacio profundo (mismos tonos que la app) -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#050b24"/>
    </linearGradient>
    <!-- Planeta: índigo → violeta → fucsia, como el planeta del 404 -->
    <linearGradient id="planet" x1="0.2" y1="0.1" x2="0.8" y2="0.95">
      <stop offset="0" stop-color="#c7d2fe"/>
      <stop offset="0.45" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#a21caf"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Estrellas -->
  <circle cx="12" cy="13" r="1.3" fill="#fff" opacity="0.9"/>
  <circle cx="22" cy="54" r="1" fill="#fff" opacity="0.7"/>
  <circle cx="55" cy="45" r="1.1" fill="#fff" opacity="0.8"/>
  <circle cx="9" cy="40" r="0.8" fill="#fff" opacity="0.6"/>
  <!-- Destello de cuatro puntas -->
  <path d="M51 8 L52.4 12.6 L57 14 L52.4 15.4 L51 20 L49.6 15.4 L45 14 L49.6 12.6 Z" fill="#fde68a"/>

  <g transform="rotate(-20 32 34)">
    <!-- Mitad trasera del anillo (queda detrás del planeta) -->
    <path d="M7 34 A25 7.5 0 0 1 57 34" fill="none" stroke="#e0e7ff" stroke-width="3" stroke-linecap="round" opacity="0.75"/>
  </g>

  <!-- Planeta con un par de cráteres -->
  <circle cx="32" cy="34" r="14" fill="url(#planet)"/>
  <circle cx="27" cy="29" r="2.6" fill="#1e1b4b" opacity="0.25"/>
  <circle cx="37" cy="39" r="1.8" fill="#1e1b4b" opacity="0.25"/>

  <g transform="rotate(-20 32 34)">
    <!-- Mitad delantera del anillo (pasa por delante del planeta) -->
    <path d="M7 34 A25 7.5 0 0 0 57 34" fill="none" stroke="#e0e7ff" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
